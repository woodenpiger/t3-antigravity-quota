<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none">
  <defs>
    <!-- Pure Neutral Obsidian Studio Canvas (zero purple/cyan AI fog) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0C0E"/>
      <stop offset="55%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#0C0D10"/>
    </linearGradient>
    <radialGradient id="ambientSoft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 120) rotate(-14) scale(480 280)">
      <stop offset="0%" stop-color="#DCE6F2" stop-opacity="0.11"/>
      <stop offset="60%" stop-color="#B8C7DA" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#B8C7DA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientLow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 320) scale(420 220)">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Glass Outer Frame & Specular Fresnel Rim -->
    <linearGradient id="glassOuter" x1="748" y1="36" x2="1136" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.085"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="748" y1="36" x2="1136" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="54%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="meniscus" x1="942" y1="36" x2="942" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="innerCard" x1="766" y1="90" x2="1118" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>

    <!-- Editorial Mineral Bar Fills (zero neon glow) -->
    <linearGradient id="barJade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3F9E7D"/>
      <stop offset="100%" stop-color="#55BA95"/>
    </linearGradient>
    <linearGradient id="barOchre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B98A3A"/>
      <stop offset="100%" stop-color="#D4A654"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="26" fill="url(#ambientSoft)"/>
  <rect width="1200" height="380" rx="26" fill="url(#ambientLow)"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- Left Suzhe Editorial Typography -->
  <g transform="translate(68, 66)">
    <!-- Monochrome Prism Badge -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.065" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2"/>
    <path d="M16 38.5L26 14.5L36 38.5" stroke="#F4F5F7" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20.6 30.8C23.8 28.9 28.2 28.9 31.4 30.8" stroke="#F4F5F7" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="40.5" cy="40" r="4.2" fill="#55BA95" stroke="#111317" stroke-width="2"/>

    <text x="68" y="23" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, PingFang SC, Inter, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.2">T3 CODE (BETA) · WINDOWS PLUGIN</text>
    <text x="68" y="44" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, PingFang SC, Inter, sans-serif" font-size="13.5" font-weight="500">v2.2.0 · 4-Layer SDF Liquid Glass</text>

    <text x="0" y="116" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, PingFang SC, Inter, sans-serif" font-size="45" font-weight="700" letter-spacing="-1.3">T3 Antigravity Quota</text>
    <text x="0" y="156" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, PingFang SC, Microsoft YaHei, sans-serif" font-size="18.5" font-weight="400">原生嵌入侧栏的液态玻璃额度仪表盘 · 悬停极简预览 · 点击全量透视</text>

    <!-- Quiet Architectural Spec Strip (no flashy AI badge clutter) -->
    <line x1="0" y1="194" x2="590" y2="194" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <g transform="translate(0, 224)" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, PingFang SC, Inter, sans-serif" font-size="13.5" font-weight="500" fill="#D1D5DB">
      <text x="0" y="0">SDF 边缘光学折射</text>
      <text x="136" y="0" fill="#6B7280">·</text>
      <text x="156" y="0">内嵌服务重启不失效</text>
      <text x="306" y="0" fill="#6B7280">·</text>
      <text x="326" y="0">ACP 无弹窗静默续期</text>
      <text x="478" y="0" fill="#6B7280">·</text>
      <text x="498" y="0">0 外部依赖</text>
    </g>
  </g>

  <!-- Right Smoked Crystal Liquid Glass Card Preview (matches v2.2.0 UI) -->
  <g transform="translate(748, 36)">
    <!-- Subtle refracted code lines behind the glass perimeter -->
    <g opacity="0.22" font-family="ui-monospace, Consolas, monospace" font-size="11.5">
      <text x="-28" y="64" fill="#9CA3AF">retrieveUserQuotaSummary</text>
      <text x="302" y="128" fill="#55BA95">"loadCodeAssist"</text>
      <text x="314" y="256" fill="#9CA3AF">silentRenewal</text>
    </g>

    <!-- Outer Liquid Glass Panel -->
    <rect x="0" y="0" width="388" height="308" rx="22" fill="url(#glassOuter)" stroke="url(#glassRim)" stroke-width="1.35"/>
    <rect x="1" y="1" width="386" height="72" rx="21" fill="url(#meniscus)"/>

    <!-- Header -->
    <path d="M22 36L27.5 23L33 36" stroke="#F4F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24.6 31.8C26.4 30.8 28.6 30.8 30.4 31.8" stroke="#F4F5F7" stroke-width="1.7" stroke-linecap="round"/>
    <text x="42" y="34" fill="#F8FAFC" font-family="-apple-system, SF Pro Display, Inter, sans-serif" font-size="15" font-weight="650">Antigravity</text>
    <text x="131" y="34" fill="#6B7280" font-family="-apple-system, Inter, sans-serif" font-size="13">·</text>
    <text x="143" y="34" fill="#9CA3AF" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="12.5" font-weight="500">Google AI Pro</text>

    <!-- Hero Inner Glass Sub-Card -->
