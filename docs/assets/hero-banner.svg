    <text x="30" y="75" fill="#9CA3AF" font-family="-apple-system, PingFang SC, sans-serif" font-size="11.5">当前最低剩余额度</text>
    <text x="30" y="114" fill="#F8FAFC" font-family="-apple-system, SF Pro Display, Inter, sans-serif" font-size="36" font-weight="700" letter-spacing="-1.2">49.6</text>
    <text x="108" y="114" fill="#9CA3AF" font-family="-apple-system, SF Pro Display, Inter, sans-serif" font-size="16" font-weight="600">%</text>
    <text x="30" y="130" fill="#8B929E" font-family="-apple-system, Inter, sans-serif" font-size="11.5">Claude &amp; GPT (shared) · Weekly</text>

    <circle cx="318" cy="104" r="3.5" fill="#D4A654"/>
    <text x="328" y="108" fill="#DFB86B" font-family="-apple-system, PingFang SC, sans-serif" font-size="13" font-weight="600">适中</text>
    <text x="356" y="128" text-anchor="end" fill="#8B929E" font-family="-apple-system, Inter, sans-serif" font-size="11.5">AI Credits ≥ 50</text>

    <!-- Pool Inner Glass Sub-Card -->
    <rect x="16" y="148" width="356" height="114" rx="14" fill="url(#innerCard)" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="1"/>

    <!-- Window Row 1 -->
    <text x="30" y="172" fill="#E5E7EB" font-family="-apple-system, PingFang SC, sans-serif" font-size="12.5" font-weight="500">Gemini · 5 小时突发窗口</text>
    <text x="356" y="172" text-anchor="end" fill="#F8FAFC" font-family="-apple-system, SF Pro Display, Inter, sans-serif" font-size="13" font-weight="650">68.4%</text>
    <rect x="30" y="182" width="326" height="5.5" rx="2.75" fill="#FFFFFF" fill-opacity="0.11"/>
    <rect x="30" y="182" width="223" height="5.5" rx="2.75" fill="url(#barJade)"/>

    <!-- Window Row 2 -->
    <text x="30" y="216" fill="#E5E7EB" font-family="-apple-system, PingFang SC, sans-serif" font-size="12.5" font-weight="500">Claude &amp; GPT · 每周总额度</text>
    <text x="356" y="216" text-anchor="end" fill="#F8FAFC" font-family="-apple-system, SF Pro Display, Inter, sans-serif" font-size="13" font-weight="650">49.6%</text>
    <rect x="30" y="226" width="326" height="5.5" rx="2.75" fill="#FFFFFF" fill-opacity="0.11"/>
    <rect x="30" y="226" width="162" height="5.5" rx="2.75" fill="url(#barOchre)"/>
    <text x="30" y="249" fill="#8B929E" font-family="-apple-system, PingFang SC, sans-serif" font-size="11.5">已用 50.4%</text>
    <text x="356" y="249" text-anchor="end" fill="#8B929E" font-family="-apple-system, PingFang SC, sans-serif" font-size="11.5">重置 4天 19小时 11分</text>

    <!-- Footer Status -->
    <line x1="16" y1="274" x2="372" y2="274" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="18" y="294" fill="#8B929E" font-family="-apple-system, PingFang SC, sans-serif" font-size="11.5">实时 · 来自本机 Antigravity 凭证</text>
  </g>
</svg>
