    <text x="340" y="168" text-anchor="end" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">68.4%</text>
    <rect x="24" y="178" width="316" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.10"/>
